<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exercise">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="app-version" content="1.1.0">
  <title>Exercise</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text x='50' y='66' font-size='46' text-anchor='middle'>🏃</text></svg>">
  <link rel="manifest" href="/exercise.webmanifest">
  <style>
    /* Same theme tokens as index.html, so the shared row renderer's var(--x)
       inline styles resolve identically here. Dark is the default; light follows
       the phone's appearance setting. */
    :root {
      --t1: #e0e0e0; --t2: #ccc; --t3: #aaa; --t4: #888; --t5: #666; --t6: #555;
      --s1: #1a1a2e; --s2: #23234a;
      --ok: #4ade80; --ok2: #4CAF50; --warn: #fbbf24; --warn2: #fb923c; --orange: #FF9800; --bad: #f87171; --bad2: #f44336;
      --purple: #c084fc; --info: #60a5fa; --info2: #2196F3; --cyan: #22d3ee; --lime: #a3e635; --indigo: #a5b4fc; --teal: #4ecdc4;
      --w03: rgba(255,255,255,0.03); --w04: rgba(255,255,255,0.04); --w05: rgba(255,255,255,0.05); --w06: rgba(255,255,255,0.06); --w07: rgba(255,255,255,0.07); --w08: rgba(255,255,255,0.08); --w09: rgba(255,255,255,0.09);
      --w10: rgba(255,255,255,0.1); --w12: rgba(255,255,255,0.12); --w14: rgba(255,255,255,0.14); --w15: rgba(255,255,255,0.15); --w20: rgba(255,255,255,0.2); --w25: rgba(255,255,255,0.25); --w28: rgba(255,255,255,0.28);
      --w30: rgba(255,255,255,0.3); --w35: rgba(255,255,255,0.35); --w40: rgba(255,255,255,0.4); --w45: rgba(255,255,255,0.45); --w50: rgba(255,255,255,0.5); --w55: rgba(255,255,255,0.55); --w60: rgba(255,255,255,0.6);
      --w65: rgba(255,255,255,0.65); --w72: rgba(255,255,255,0.72); --w75: rgba(255,255,255,0.75); --w80: rgba(255,255,255,0.8); --w85: rgba(255,255,255,0.85); --w90: rgba(255,255,255,0.9); --w95: rgba(255,255,255,0.95);
      --bg: #1a1a2e; --bg2: #16213e; --card: rgba(255,255,255,0.05);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --t1: #1a1a2e; --t2: #334155; --t3: #475569; --t4: #64748b; --t5: #7c8698; --t6: #94a3b8;
        --s1: #f1f3f7; --s2: #e9ecf2;
        --ok: #15803d; --ok2: #2e7d32; --warn: #b45309; --warn2: #c2410c; --orange: #e65100; --bad: #dc2626; --bad2: #c62828;
        --purple: #7e22ce; --info: #1d4ed8; --info2: #1565c0; --cyan: #0e7490; --lime: #4d7c0f; --indigo: #4338ca; --teal: #0f766e;
        --w03: rgba(26,26,46,0.03); --w04: rgba(26,26,46,0.04); --w05: rgba(26,26,46,0.05); --w06: rgba(26,26,46,0.06); --w07: rgba(26,26,46,0.07); --w08: rgba(26,26,46,0.08); --w09: rgba(26,26,46,0.09);
        --w10: rgba(26,26,46,0.1); --w12: rgba(26,26,46,0.12); --w14: rgba(26,26,46,0.14); --w15: rgba(26,26,46,0.15); --w20: rgba(26,26,46,0.2); --w25: rgba(26,26,46,0.25); --w28: rgba(26,26,46,0.28);
        --w30: rgba(26,26,46,0.3); --w35: rgba(26,26,46,0.35); --w40: rgba(26,26,46,0.4); --w45: rgba(26,26,46,0.45); --w50: rgba(26,26,46,0.5); --w55: rgba(26,26,46,0.55); --w60: rgba(26,26,46,0.6);
        --w65: rgba(26,26,46,0.65); --w72: rgba(26,26,46,0.72); --w75: rgba(26,26,46,0.75); --w80: rgba(26,26,46,0.8); --w85: rgba(26,26,46,0.85); --w90: rgba(26,26,46,0.9); --w95: rgba(26,26,46,0.95);
        --bg: #f0f2f5; --bg2: #e8eaed; --card: rgba(255,255,255,0.7);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.35;
      color: var(--t1);
      background: var(--bg);
      background: -webkit-linear-gradient(315deg, var(--bg) 0%, var(--bg2) 100%);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      background-attachment: fixed;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)) 16px;
      -webkit-text-size-adjust: 100%;
    }
    .header { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; -webkit-justify-content: space-between; justify-content: space-between; margin: 6px 0 12px 0; }
    .header h1 { font-size: 1.35em; margin: 0; font-weight: 700; }
    .header .meta { font-size: 0.78em; color: var(--t4); }
    .header .meta button { font-size: 1em; color: var(--info); background: none; border: 0; padding: 0 0 0 8px; cursor: pointer; }
    .panel { background: var(--card); border-radius: 14px; padding: 6px 14px; margin-bottom: 12px; border: 1px solid var(--w06); }
    .panel.empty { padding: 14px; color: var(--t4); text-align: center; }
    .status { font-size: 0.82em; color: var(--t4); text-align: center; min-height: 1.3em; margin-top: 4px; }
    .status.bad { color: var(--bad); }
    .status.ok { color: var(--ok); }
    .setup label { display: block; font-size: 0.9em; color: var(--t3); margin: 10px 0 6px 0; }
    .setup input { width: 100%; font-size: 1em; padding: 12px; border-radius: 10px; border: 1px solid var(--w20); background: var(--s1); color: var(--t1); }
    .setup .hint { font-size: 0.82em; color: var(--t4); margin: 10px 0; }
    .btn { display: block; width: 100%; font-size: 1em; font-weight: 600; padding: 13px; margin: 10px 0 6px 0; border-radius: 10px; border: 1px solid var(--info); background: rgba(96,165,250,0.12); color: var(--info); cursor: pointer; }
    .link { background: none; border: 0; color: var(--t4); font-size: 0.82em; padding: 10px; cursor: pointer; width: 100%; text-align: center; }
    /* The shared row renderer sizes its buttons for a wall screen; thumbs need
       more. Inline styles win on specificity, so override with !important. */
    #content button { min-height: 44px !important; min-width: 72px !important; font-size: 1em !important; padding: 8px 16px !important; border-radius: 10px !important; font-weight: 600; }
    #content button[onclick^="doneExerciseAt"][style*="0.75em"] { min-height: 34px !important; min-width: 0 !important; font-size: 0.85em !important; padding: 4px 12px !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>&#127939; Exercise</h1>
    <div class="meta"><span id="updated"></span><button type="button" id="refreshBtn" title="Refresh">&#8635;</button></div>
  </div>

  <div id="setup" class="panel setup" style="display:none;">
    <label for="tokenInput">Dashboard token</label>
    <input type="password" id="tokenInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Same token the dashboard screens use">
    <div class="hint">The token is the DASHBOARD_TOKEN secret of the worker this page is served from. It stays on this phone; ticks sync to every dashboard screen with the same token. Add this page to your home screen for an app icon.</div>
    <button type="button" class="btn" id="tokenSaveBtn">Save</button>
  </div>

  <div id="content" class="panel" style="display:none;"></div>
  <div id="status" class="status"></div>
  <button type="button" class="link" id="changeTokenBtn" style="display:none;">Change token</button>

  <script>
    (function() {
      var STORAGE_PREFIX = 'exerciseApp_';
      function storageKey(name) { return STORAGE_PREFIX + name; }

      // Enough of the dashboard's config/state surface for the shared block below.
      var config = {
        exercises: [],
        exerciseMorningStart: '05:00',
        exerciseEveningStart: '16:30',
        exerciseShowHistory: true,
        use24hClock: !/am|pm/i.test(new Date(2000, 0, 1, 13, 0, 0).toLocaleTimeString())
      };
      var dashboardStatus = { exerciseDone: {} };
      var dashboardStatusLoaded = false;
      var dashboardStatusLocalDirty = false;
      // Entries the worker has acknowledged; anything newer in the local log is
      // pending and gets PUT (union-merged server side). The phone never diff-PUTs
      // on a poll, so it adds no KV writes beyond one per tap.
      var serverLog = {};
      var token = '';

      function readJson(name, fallback) {
        try {
          var raw = localStorage.getItem(storageKey(name));
          var parsed = raw ? JSON.parse(raw) : null;
          return parsed && typeof parsed === 'object' ? parsed : fallback;
        } catch (e) { return fallback; }
      }
      function writeJson(name, value) {
        try { localStorage.setItem(storageKey(name), JSON.stringify(value)); } catch (e) {}
      }

      function escapeHtml(str) {
        return String(str === null || str === undefined ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function formatTime(date) {
        var hours = date.getHours();
        var minutes = date.getMinutes();
        var mm = minutes < 10 ? '0' + minutes : '' + minutes;
        if (config.use24hClock) return (hours < 10 ? '0' + hours : '' + hours) + ':' + mm;
        var h12 = hours % 12;
        if (h12 === 0) h12 = 12;
        return h12 + ':' + mm + ' ' + (hours >= 12 ? 'PM' : 'AM');
      }
      function getLocalDateStr(d) {
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      }
      function parseClockTimeToMin(t, fallbackMin) {
        if (!t || typeof t !== 'string') return fallbackMin;
        var parts = t.split(':');
        var h = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        if (isNaN(h) || isNaN(m)) return fallbackMin;
        return h * 60 + m;
      }
      function normaliseExerciseDaysForCompare(days) {
        var out = [];
        var src = Object.prototype.toString.call(days) === '[object Array]' ? days : [];
        for (var i = 0; i < src.length; i++) {
          if (typeof src[i] === 'number' && src[i] >= 0 && src[i] <= 6 && src[i] === Math.floor(src[i]) && out.indexOf(src[i]) === -1) out.push(src[i]);
        }
        out.sort(function(a, b) { return a - b; });
        return (out.length > 0 && out.length < 7) ? out : [];
      }
      // Local-only hygiene (finite positive timestamps). This is NOT the
      // client/worker sanitiser pair the dashboard must keep identical: the phone
      // never compares its log with the server's to decide whether to PUT.
      function sanitiseExerciseDoneLog(log) {
        var out = {};
        if (!log || typeof log !== 'object' || Object.prototype.toString.call(log) === '[object Array]') return out;
        for (var key in log) {
          if (!log.hasOwnProperty(key) || typeof key !== 'string' || key.length > 200) continue;
          var value = Number(log[key]);
          if (isFinite(value) && value > 0) out[key] = value;
        }
        return out;
      }
      function mergeLogs(a, b) {
        var merged = sanitiseExerciseDoneLog(a);
        var other = sanitiseExerciseDoneLog(b);
        for (var key in other) {
          if (other.hasOwnProperty(key) && (!merged[key] || other[key] > merged[key])) merged[key] = other[key];
        }
        return merged;
      }
      function readLocalExerciseDoneLog() { return sanitiseExerciseDoneLog(readJson('exercise_done', {})); }
      function writeLocalExerciseDoneLog(log) { writeJson('exercise_done', sanitiseExerciseDoneLog(log)); }
      function updateCardVisibility() {}
      // Apple Health steps feed (/api/apple-health), for the step-goal progress
      // the shared renderExerciseRow shows. Same shape as the dashboard's.
      var lastStepsData = null;
      function formatStepCount(n) {
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }
      function stepsToday() {
        if (!lastStepsData || !lastStepsData.days) return null;
        var entry = lastStepsData.days[getLocalDateStr(new Date())];
        return entry && typeof entry.steps === 'number' ? entry : null;
      }


      // >>> shared-exercise-block — copied verbatim from index.html by scripts/sync-exercise-app.js; do not edit here
      var EXERCISE_PERIODS = ['morning', 'evening', 'both', 'anytime'];
      // key, label, icon, colour token
      var EXERCISE_TYPES = [
        ['cardio', 'Cardio', '🏃', 'var(--orange)'],
        ['strength', 'Strength', '💪', 'var(--purple)'],
        ['stretch', 'Stretch', '🧘', 'var(--teal)'],
        ['walk', 'Walk', '🚶', 'var(--ok)'],
        ['balance', 'Balance', '🤸', 'var(--info)'],
        ['other', 'Other', '✨', 'var(--t4)']
      ];
      var EXERCISE_DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var EXERCISE_REMIND_BEFORE_MIN = 180;
      var EXERCISE_STREAK_CAP = 30; // the done log is pruned at 30 days

      function getExerciseType(ex) {
        var key = ex && typeof ex.type === 'string' ? ex.type : 'other';
        for (var i = 0; i < EXERCISE_TYPES.length; i++) {
          if (EXERCISE_TYPES[i][0] === key) return EXERCISE_TYPES[i];
        }
        return EXERCISE_TYPES[EXERCISE_TYPES.length - 1];
      }

      function getExerciseDoneKey(name, period, date) {
        return name + '_' + period + '_' + date;
      }

      // Skipped sessions live in the same union-merged done log under a suffixed
      // key, so the shared client/worker sanitiser covers them unchanged (same
      // 30-day retention). Done wins over skipped when both exist: a skip can be
      // taken back by doing it.
      function getExerciseSkipKey(name, period, date) {
        return getExerciseDoneKey(name, period, date) + '_skipped';
      }

      // Periods an exercise asks for on one of its scheduled days.
      function getExercisePeriods(ex) {
        var p = ex && typeof ex.period === 'string' ? ex.period : 'anytime';
        if (p === 'both') return ['morning', 'evening'];
        if (p === 'morning' || p === 'evening') return [p];
        return ['anytime'];
      }

      // Stable identity for the done log: the synced `id` (hex, assigned when
      // settings are saved), so a rename keeps history and two exercises may
      // share a name. Entries written before an exercise had an id are keyed by
      // name; reads fall back to that key for the 30 days the log keeps them.
      function getExerciseKeyBase(ex) {
        if (ex && typeof ex.id === 'string' && ex.id) return ex.id;
        return ex && typeof ex.name === 'string' ? ex.name : '';
      }

      function getExerciseLogTs(log, ex, period, date, skipped) {
        var base = getExerciseKeyBase(ex);
        var key = skipped ? getExerciseSkipKey(base, period, date) : getExerciseDoneKey(base, period, date);
        var ts = log[key] || 0;
        if (!ts && base !== ex.name && typeof ex.name === 'string' && ex.name) {
          var legacy = skipped ? getExerciseSkipKey(ex.name, period, date) : getExerciseDoneKey(ex.name, period, date);
          ts = log[legacy] || 0;
        }
        return ts;
      }

      // Effective Apple Health step goal: walks only; the explicit stepGoal, else
      // a Target note that is just a number ("10000", "10,000", "5k", "8000 steps").
      // The worker's exerciseStepGoalOf applies the same rule (regression-tested).
      function getExerciseStepGoal(ex) {
        if (!ex || ex.type !== 'walk') return 0;
        if (typeof ex.stepGoal === 'number' && ex.stepGoal > 0) return Math.round(ex.stepGoal);
        var t = typeof ex.target === 'string' ? ex.target.replace(/^\s+|\s+$/g, '') : '';
        var m = t.match(/^(\d{1,3}(?:[,\s]\d{3})+|\d+)\s*(?:steps?)?$/i);
        var n = m ? parseInt(m[1].replace(/[,\s]/g, ''), 10) : 0;
        if (!n) {
          m = t.match(/^(\d+(?:\.\d+)?)\s*k\s*(?:steps?)?$/i);
          n = m ? Math.round(parseFloat(m[1]) * 1000) : 0;
        }
        return n > 0 && n <= 200000 ? n : 0;
      }

      function getExerciseDays(ex) {
        return (ex && Object.prototype.toString.call(ex.days) === '[object Array]') ? ex.days : [];
      }

      // days: 0=Sun..6=Sat; absent/empty = every day.
      function isExerciseDay(ex, date) {
        var days = getExerciseDays(ex);
        if (days.length === 0) return true;
        return days.indexOf(date.getDay()) !== -1;
      }

      function getNextExerciseDay(ex, date) {
        for (var i = 1; i <= 7; i++) {
          var d = new Date(date.getFullYear(), date.getMonth(), date.getDate() + i);
          if (isExerciseDay(ex, d)) return d.getDay();
        }
        return date.getDay();
      }

      function getExerciseWindow(period) {
        var morningStartMin = parseClockTimeToMin(config.exerciseMorningStart, 5 * 60);
        var eveningStartMin = parseClockTimeToMin(config.exerciseEveningStart, 16 * 60 + 30);
        if (period === 'morning') return {start: morningStartMin, end: eveningStartMin};
        if (period === 'evening') return {start: eveningStartMin, end: 24 * 60};
        return {start: morningStartMin, end: 24 * 60};
      }

      function getExerciseDueInstant(period, day) {
        var w = getExerciseWindow(period);
        return new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(w.start / 60), w.start % 60, 0, 0);
      }

      // Suspended exercises track nothing; a (re)activated one ignores windows that
      // opened before its trackingStart, so an evening item added at lunch doesn't
      // show this morning's session as missed.
      function isExercisePeriodTracked(ex, period, day) {
        if (!ex || ex.suspended === true) return false;
        if (typeof ex.trackingStart !== 'string' || isNaN(Date.parse(ex.trackingStart))) return true;
        return getExerciseDueInstant(period, day).getTime() >= Date.parse(ex.trackingStart);
      }

      // One row per (exercise, period) for today. state:
      //   suspended | rest (not a scheduled day) | untracked (before trackingStart)
      //   | later (window not open yet) | open (Done/Skip buttons) | done
      //   | skipped (chosen not to do; closesInMin > 0 while it could still be done)
      //   | missed
      function getExerciseRows(now, log) {
        var list = config.exercises || [];
        var rows = [];
        var nowMin = now.getHours() * 60 + now.getMinutes();
        var today = getLocalDateStr(now);
        for (var i = 0; i < list.length; i++) {
          var ex = list[i];
          if (!ex || typeof ex.name !== 'string' || !ex.name) continue;
          var periods = getExercisePeriods(ex);
          for (var p = 0; p < periods.length; p++) {
            var period = periods[p];
            var w = getExerciseWindow(period);
            var key = getExerciseDoneKey(getExerciseKeyBase(ex), period, today);
            var row = {ex: ex, index: i, period: period, date: today, key: key, doneTs: getExerciseLogTs(log, ex, period, today, false), skippedTs: getExerciseLogTs(log, ex, period, today, true), closesInMin: 0, nextDay: -1, state: 'open'};
            if (ex.suspended === true) {
              row.state = 'suspended';
            } else if (row.doneTs) {
              row.state = 'done';
            } else if (row.skippedTs) {
              row.state = 'skipped';
              if (nowMin >= w.start && nowMin < w.end) row.closesInMin = w.end - nowMin;
            } else if (!isExerciseDay(ex, now)) {
              row.state = 'rest';
              row.nextDay = getNextExerciseDay(ex, now);
            } else if (!isExercisePeriodTracked(ex, period, now)) {
              row.state = 'untracked';
            } else if (nowMin < w.start) {
              row.state = 'later';
            } else if (nowMin >= w.end) {
              row.state = 'missed';
            } else {
              row.closesInMin = w.end - nowMin;
            }
            rows.push(row);
          }
        }
        return rows;
      }

      // Due = open or done today. names = the open ones (ticker / Needs Attention).
      // Skipped sessions are resolved — nothing left to nag about — but never
      // count as done, so they sit outside total and are reported separately.
      function countExerciseDue() {
        var rows = getExerciseRows(new Date(), getExerciseDoneLog());
        var total = 0;
        var done = 0;
        var skipped = 0;
        var names = [];
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].state === 'done') { total++; done++; }
          else if (rows[i].state === 'skipped') { skipped++; }
          else if (rows[i].state === 'open') {
            total++;
            if (names.indexOf(rows[i].ex.name) === -1) names.push(rows[i].ex.name);
          }
        }
        return {total: total, done: done, skipped: skipped, remaining: total - done, names: names};
      }

      // Consecutive scheduled days (today if finished, else from yesterday) on
      // which every tracked period was done. A day with sessions still open does
      // not break it; a skipped session is not done, so it does (from tomorrow).
      // Capped: the done log only keeps 30 days.
      function getExerciseStreak(ex, log, now) {
        if (!ex || ex.suspended === true) return 0;
        var periods = getExercisePeriods(ex);
        var streak = 0;
        for (var back = 0; back <= 45 && streak < EXERCISE_STREAK_CAP; back++) {
          var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
          if (!isExerciseDay(ex, day)) continue;
          var dateStr = getLocalDateStr(day);
          var tracked = 0;
          var done = 0;
          for (var i = 0; i < periods.length; i++) {
            if (getExerciseLogTs(log, ex, periods[i], dateStr, false)) { tracked++; done++; continue; }
            if (isExercisePeriodTracked(ex, periods[i], day)) tracked++;
          }
          if (tracked === 0) {
            if (back === 0) continue; // nothing tracked yet today
            break; // before the latest (re)activation
          }
          if (done >= tracked) { streak++; continue; }
          if (back === 0) continue; // today still in progress
          break;
        }
        return streak;
      }

      function getExerciseDaysLabel(ex) {
        var days = normaliseExerciseDaysForCompare(getExerciseDays(ex));
        if (days.length === 0) return 'Every day';
        if (days.join(',') === '1,2,3,4,5') return 'Weekdays';
        if (days.join(',') === '0,6') return 'Weekends';
        var names = [];
        var order = [1, 2, 3, 4, 5, 6, 0];
        for (var i = 0; i < order.length; i++) {
          if (days.indexOf(order[i]) !== -1) names.push(EXERCISE_DAY_SHORT[order[i]]);
        }
        return names.join(' ');
      }

      function getExercisePeriodLabel(period) {
        if (period === 'morning') return 'Morning';
        if (period === 'evening') return 'Evening';
        if (period === 'both') return 'Morning & evening';
        return 'Any time';
      }

      function getExerciseDoneLog() {
        if (dashboardStatusLoaded && dashboardStatus.exerciseDone) {
          return sanitiseExerciseDoneLog(dashboardStatus.exerciseDone);
        }
        return readLocalExerciseDoneLog();
      }

      function saveExerciseDoneLog(log) {
        var cleanLog = sanitiseExerciseDoneLog(log);
        writeLocalExerciseDoneLog(cleanLog);
        dashboardStatus.exerciseDone = cleanLog;
        if (dashboardStatusLoaded) {
          saveDashboardStatus();
        } else {
          dashboardStatusLocalDirty = true;
        }
      }

      // Last 7 days for one (exercise, period): filled = done, solid red =
      // skipped, hollow amber = open now, hollow grey = later today, dim = rest
      // day / not tracked, faded red = missed. Render-only from the done log.
      function buildExerciseHistoryStrip(ex, period, log, now) {
        var w = getExerciseWindow(period);
        var nowMin = now.getHours() * 60 + now.getMinutes();
        var html = '<div style="margin-top:5px;font-size:0;line-height:0;">';
        for (var d = 6; d >= 0; d--) {
          var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d);
          var dateStr = getLocalDateStr(day);
          var title = EXERCISE_DAY_SHORT[day.getDay()] + ' ' + dateStr;
          var style;
          if (getExerciseLogTs(log, ex, period, dateStr, false)) {
            style = 'background:var(--ok);';
            title = title + ' done';
          } else if (getExerciseLogTs(log, ex, period, dateStr, true)) {
            style = 'background:var(--bad);';
            title = title + ' skipped';
          } else if (!isExerciseDay(ex, day) || !isExercisePeriodTracked(ex, period, day)) {
            style = 'background:var(--w08);';
            title = title + (isExerciseDay(ex, day) ? ' not tracked' : ' rest day');
          } else if (d === 0 && nowMin < w.start) {
            style = 'background:transparent;border:1px solid var(--w25);';
            title = title + ' later today';
          } else if (d === 0 && nowMin < w.end) {
            style = 'background:transparent;border:1px solid var(--warn);';
            title = title + ' open';
          } else {
            style = 'background:var(--bad);opacity:0.5;';
            title = title + ' missed';
          }
          html = html + '<span title="' + title + '" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;' + style + '"></span>';
        }
        return html + '</div>';
      }

      function renderExerciseRow(row, log, now) {
        var ex = row.ex;
        var type = getExerciseType(ex);
        var html = '<div style="padding:8px 0;border-bottom:1px solid var(--w06);' + (ex.suspended === true ? 'opacity:0.68;' : '') + '">';
        html = html + '<div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;">';
        html = html + '<div style="-webkit-flex:1;flex:1;min-width:0;overflow:hidden;">';
        html = html + '<span style="font-size:0.95em;margin-right:5px;" title="' + type[1] + '">' + type[2] + '</span>';
        html = html + '<span style="font-weight:600;color:var(--t1);">' + escapeHtml(ex.name) + '</span>'; // exerciseDef syncs from other devices
        var stepGoal = getExerciseStepGoal(ex);
        if (typeof ex.target === 'string' && ex.target && !(stepGoal > 0 && !(typeof ex.stepGoal === 'number' && ex.stepGoal > 0))) {
          html = html + ' <span style="font-size:0.8em;color:var(--t3);margin-left:4px;">' + escapeHtml(ex.target) + '</span>';
        }
        if (stepGoal > 0) {
          // Apple Health step goal (walks only): the worker marks the row done when the pushed
          // total reaches it; show the goal and, once today's total is known,
          // the progress (lastStepsData/stepsToday come from the Health feed).
          // Only a row scheduled today gets today's count: a walk on another
          // weekday (rest / untracked / suspended) shows just its goal.
          var goalToday = (row.state !== 'rest' && row.state !== 'untracked' && row.state !== 'suspended' && typeof stepsToday === 'function') ? stepsToday() : null;
          var goalColor = goalToday && goalToday.steps >= stepGoal ? 'var(--ok)' : 'var(--t3)';
          html = html + ' <span style="font-size:0.8em;color:' + goalColor + ';margin-left:4px;white-space:nowrap;" title="Marked done automatically when Apple Health steps reach the goal">&#128099; ' + (goalToday ? formatStepCount(goalToday.steps) + ' / ' : '') + formatStepCount(stepGoal) + '</span>';
        }
        html = html + '<div style="margin-top:2px;font-size:0.78em;color:var(--t4);">';
        html = html + '<span style="color:' + type[3] + ';">' + type[1] + '</span>';
        html = html + ' · ' + getExercisePeriodLabel(ex.period) + ' · ' + getExerciseDaysLabel(ex);
        if (ex.suspended === true) {
          html = html + ' <span style="color:var(--warn);">Suspended</span>';
        } else if (config.exerciseShowHistory) {
          var streak = getExerciseStreak(ex, log, now);
          if (streak >= 2) {
            html = html + ' · <span style="color:var(--orange);" title="Consecutive scheduled days completed">🔥 ' + (streak >= EXERCISE_STREAK_CAP ? EXERCISE_STREAK_CAP + '+' : streak) + '-day streak</span>';
          }
        }
        html = html + '</div>';
        if (config.exerciseShowHistory && ex.suspended !== true) {
          html = html + buildExerciseHistoryStrip(ex, row.period, log, now);
        }
        html = html + '</div>';

        html = html + '<div style="-webkit-flex-shrink:0;flex-shrink:0;margin-left:8px;text-align:right;min-width:90px;white-space:nowrap;">';
        if (row.state === 'suspended') {
          html = html + '<span style="color:var(--warn);font-size:0.85em;">Not tracking</span>';
        } else if (row.state === 'rest') {
          html = html + '<span style="color:var(--t5);font-size:0.85em;">Next ' + EXERCISE_DAY_SHORT[row.nextDay] + '</span>';
        } else if (row.state === 'untracked') {
          html = html + '<span style="color:var(--t5);font-size:0.85em;">Next session</span>';
        } else if (row.state === 'later') {
          html = html + '<span style="color:var(--t5);font-size:0.85em;">' + (row.period === 'evening' ? 'Tonight' : 'Later today') + '</span>';
        } else if (row.state === 'missed') {
          html = html + '<span style="color:var(--t5);font-size:0.85em;">Missed</span>';
        } else if (row.state === 'done') {
          var doneTime = formatTime(new Date(row.doneTs));
          html = html + '<span style="color:var(--ok);font-size:0.85em;" title="Done at ' + doneTime + '">&#10003; ' + doneTime + '</span>';
        } else if (row.state === 'skipped') {
          var skipTime = formatTime(new Date(row.skippedTs));
          html = html + '<span style="color:var(--bad);font-size:0.85em;" title="Skipped at ' + skipTime + '">&#10005; Skipped</span>';
          // Still inside the window: a skip can be taken back by doing it (done
          // wins over skipped in the log, and a union merge can't delete the skip).
          if (row.closesInMin > 0) {
            html = html + ' ' + buildExerciseActionButton('doneExerciseAt', row, 'var(--ok)', 'rgba(74,222,128,0.1)', 'Done', 'padding:2px 8px;font-size:0.75em;margin-left:6px;');
          }
        } else {
          html = html + buildExerciseActionButton('skipExerciseAt', row, 'var(--bad)', 'rgba(248,113,113,0.1)', 'Skip', 'padding:4px 9px;font-size:0.85em;margin-right:6px;');
          html = html + buildExerciseActionButton('doneExerciseAt', row, 'var(--ok)', 'rgba(74,222,128,0.1)', 'Done', 'padding:4px 12px;font-size:0.85em;');
        }
        html = html + '</div>';
        return html + '</div></div>';
      }

      // Pass the index, not the name: a name with a quote would otherwise break
      // out of the attribute (synced, untrusted text). period/date are validated
      // by the handler.
      function buildExerciseActionButton(fn, row, colour, tint, label, extraStyle) {
        return '<button type="button" onclick="' + fn + '(' + row.index + ', \'' + row.period + '\', \'' + row.date + '\')" ' +
          'style="border-radius:6px;border:1px solid ' + colour + ';background:' + tint + ';color:' + colour + ';cursor:pointer;' + extraStyle + '">' + label + '</button>';
      }

      // <<< shared-exercise-block

      // --- Phone-side rendering (mirrors renderExercise in index.html) ---

      function el(id) { return document.getElementById(id); }

      function setStatus(msg, cls) {
        var s = el('status');
        s.textContent = msg || '';
        s.className = 'status' + (cls ? ' ' + cls : '');
      }

      function renderExercise() {
        var list = config.exercises || [];
        var content = el('content');
        content.style.display = '';
        if (list.length === 0) {
          content.className = 'panel empty';
          content.innerHTML = dashboardStatusLoaded ? 'No exercise configured yet. Add some in the dashboard’s Settings → Exercise; the list syncs here.' : 'Loading…';
          return;
        }
        content.className = 'panel';
        var now = new Date();
        var log = getExerciseDoneLog();
        var rows = getExerciseRows(now, log);
        var sections = [['morning', 'Morning'], ['anytime', 'Any time'], ['evening', 'Evening']];
        var sectionsUsed = 0;
        for (var s = 0; s < sections.length; s++) {
          for (var r = 0; r < rows.length; r++) {
            if (rows[r].period === sections[s][0]) { sectionsUsed++; break; }
          }
        }
        var html = '';
        var dueCount = 0;
        var skippedCount = 0;
        var allDone = true;
        for (var si = 0; si < sections.length; si++) {
          var sectionHtml = '';
          for (var ri = 0; ri < rows.length; ri++) {
            var row = rows[ri];
            if (row.period !== sections[si][0]) continue;
            if (row.state === 'open' || row.state === 'done') dueCount++;
            if (row.state === 'skipped') skippedCount++;
            if (row.state === 'open' || row.state === 'missed') allDone = false;
            sectionHtml = sectionHtml + renderExerciseRow(row, log, now);
          }
          if (!sectionHtml) continue;
          if (sectionsUsed > 1) {
            html = html + '<div style="font-size:0.72em;letter-spacing:0.06em;text-transform:uppercase;color:var(--t4);padding:8px 0 0 0;">' + sections[si][1] + '</div>';
          }
          html = html + sectionHtml;
        }
        if (dueCount > 0 && allDone && skippedCount === 0) {
          html = html + '<div style="text-align:center;color:var(--ok);padding:10px 0;font-weight:600;">All exercise done &#10003;</div>';
        } else if (allDone && skippedCount > 0) {
          html = html + '<div style="text-align:center;color:var(--t4);padding:10px 0;font-size:0.9em;">Nothing left today &middot; <span style="color:var(--bad);">' + skippedCount + ' skipped</span></div>';
        }
        content.innerHTML = html;
      }

      function markExerciseAt(index, period, date, skipped) {
        var ex = (config.exercises || [])[index];
        if (!ex || !ex.name) return;
        if (!/^(morning|evening|anytime)$/.test(String(period)) || !/^\d{4}-\d{2}-\d{2}$/.test(String(date))) return;
        var log = getExerciseDoneLog();
        var base = getExerciseKeyBase(ex);
        var key = skipped ? getExerciseSkipKey(base, period, date) : getExerciseDoneKey(base, period, date);
        log[key] = new Date().getTime();
        saveExerciseDoneLog(log);
        // Before the first successful GET the shared helper only flags the log
        // dirty; still queue the tap so it is PUT (or kept pending) right away.
        if (!dashboardStatusLoaded) saveDashboardStatus();
        renderExercise();
      }
      window.doneExerciseAt = function(index, period, date) { markExerciseAt(index, period, date, false); };
      window.skipExerciseAt = function(index, period, date) { markExerciseAt(index, period, date, true); };

      // --- Sync with the worker (same origin, same token as the screens) ---

      function request(method, path, body, onDone) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, window.location.origin + path, true);
        xhr.timeout = 20000;
        xhr.setRequestHeader('X-Dashboard-Token', token);
        if (body) xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function() {
          if (xhr.readyState !== 4) return;
          var data = null;
          if (xhr.status === 200) {
            try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
          }
          onDone(xhr.status, data);
        };
        xhr.ontimeout = function() { onDone(0, null); };
        xhr.onerror = function() { onDone(0, null); };
        try { xhr.send(body ? JSON.stringify(body) : null); } catch (e) { onDone(0, null); }
      }

      function pendingEntries() {
        var log = dashboardStatus.exerciseDone || {};
        var pending = {};
        var any = false;
        for (var key in log) {
          if (log.hasOwnProperty(key) && (!serverLog[key] || log[key] > serverLog[key])) { pending[key] = log[key]; any = true; }
        }
        return any ? pending : null;
      }

      var saveInFlight = false;
      function saveDashboardStatus() {
        var pending = pendingEntries();
        writeJson('pending', pending || {});
        if (!pending || saveInFlight || !token) return;
        saveInFlight = true;
        setStatus('Syncing…');
        request('PUT', '/api/dashboard-status', { exerciseDone: pending }, function(status, data) {
          saveInFlight = false;
          if (status === 200 && data) {
            adoptRemote(data);
            setStatus('Synced ' + formatTime(new Date()), 'ok');
          } else if (status === 401) {
            setStatus('Token rejected. Tap "Change token".', 'bad');
          } else {
            setStatus('Saved on this phone; will sync when online.', 'bad');
          }
        });
      }

      function adoptRemote(data) {
        var def = data && data.exerciseDef && typeof data.exerciseDef === 'object' ? data.exerciseDef : null;
        if (def) {
          config.exercises = Object.prototype.toString.call(def.exercises) === '[object Array]' ? def.exercises : [];
          if (typeof def.morningStart === 'string') config.exerciseMorningStart = def.morningStart;
          if (typeof def.eveningStart === 'string') config.exerciseEveningStart = def.eveningStart;
          writeJson('def', def);
        }
        serverLog = sanitiseExerciseDoneLog(data ? data.exerciseDone : null);
        writeJson('server_log', serverLog);
        var merged = mergeLogs(serverLog, dashboardStatus.exerciseDone);
        dashboardStatus.exerciseDone = merged;
        writeLocalExerciseDoneLog(merged);
        writeJson('pending', pendingEntries() || {}); // whatever the server now holds is no longer pending
        dashboardStatusLoaded = true;
        el('updated').textContent = 'Updated ' + formatTime(new Date());
        renderExercise();
      }

      var loadInFlight = false;
      function loadStatus() {
        if (!token || loadInFlight) return;
        loadInFlight = true;
        request('GET', '/api/dashboard-status', null, function(status, data) {
          loadInFlight = false;
          if (status === 200 && data) {
            adoptRemote(data);
            if (pendingEntries()) saveDashboardStatus();
            else if (!saveInFlight) setStatus('');
          } else if (status === 401) {
            setStatus('Token rejected. Tap "Change token".', 'bad');
            showSetup(true);
          } else {
            setStatus(dashboardStatusLoaded || config.exercises.length ? 'Offline — showing the last synced state.' : 'Can’t reach the dashboard. Check your connection.', 'bad');
            renderExercise();
          }
        });
      }

      var lastStepsAt = 0;
      function fetchSteps(force) {
        if (!token) return;
        var now = Date.now();
        if (!force && now - lastStepsAt < 10 * 60 * 1000) return;
        lastStepsAt = now;
        request('GET', '/api/apple-health', null, function(status, data) {
          if (status === 200 && data && data.days && typeof data.days === 'object') {
            lastStepsData = data;
            renderExercise();
          }
        });
      }

      function refreshAll() {
        loadStatus();
        fetchSteps();
      }

      // --- Token setup ---

      function showSetup(show) {
        el('setup').style.display = show ? '' : 'none';
        el('changeTokenBtn').style.display = show ? 'none' : '';
        el('content').style.display = show ? 'none' : '';
        if (show) { el('tokenInput').value = ''; el('tokenInput').focus(); }
      }

      function saveToken() {
        var value = el('tokenInput').value.replace(/^\s+|\s+$/g, '');
        if (!value) return;
        token = value;
        try { localStorage.setItem(storageKey('token'), token); } catch (e) {}
        showSetup(false);
        setStatus('Connecting…');
        refreshAll();
      }

      function init() {
        try { token = localStorage.getItem(storageKey('token')) || ''; } catch (e) { token = ''; }
        // Render from cache first so the app is useful before the first round-trip.
        var cachedDef = readJson('def', null);
        if (cachedDef) {
          config.exercises = Object.prototype.toString.call(cachedDef.exercises) === '[object Array]' ? cachedDef.exercises : [];
          if (typeof cachedDef.morningStart === 'string') config.exerciseMorningStart = cachedDef.morningStart;
          if (typeof cachedDef.eveningStart === 'string') config.exerciseEveningStart = cachedDef.eveningStart;
        }
        serverLog = sanitiseExerciseDoneLog(readJson('server_log', {}));
        dashboardStatus.exerciseDone = mergeLogs(readLocalExerciseDoneLog(), readJson('pending', {}));
        writeLocalExerciseDoneLog(dashboardStatus.exerciseDone);

        el('tokenSaveBtn').onclick = saveToken;
        el('tokenInput').onkeydown = function(e) { if (e.keyCode === 13) saveToken(); };
        el('changeTokenBtn').onclick = function() { showSetup(true); };
        el('refreshBtn').onclick = function() { refreshAll(); };

        // Poll only while on screen: GET-only, so it costs no KV writes. Both
        // no-op without a token, so they are armed before the first-run screen
        // (entering the token must not need a reload to start syncing).
        setInterval(function() {
          if (document.hidden || !token) return;
          renderExercise(); // windows open/close on the minute
          loadStatus();
        }, 60 * 1000);
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden && token) refreshAll();
        }, false);

        if (!token) {
          showSetup(true);
          return;
        }
        showSetup(false);
        renderExercise();
        refreshAll();
      }

      init();
    })();
  </script>
</body>
</html>
